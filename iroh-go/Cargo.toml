[package]
name = "iroh-go"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "iroh"
crate-type = ["staticlib"]

[dependencies]
iroh-ffi = { git = "https://github.com/decentral1se/iroh-ffi", rev = "3e102569e1c348480416a9b05cf020760f607dfe" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true
