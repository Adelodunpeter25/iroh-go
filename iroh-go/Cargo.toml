[package]
name = "iroh-go"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "iroh"
crate-type = ["staticlib"]

[dependencies]
iroh-ffi = { git = "https://github.com/decentral1se/iroh-ffi", rev = "53e0abb14f3f36b90cdae0df7063910f64cf5299" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "unwind"
strip = true
