---
kind: pipeline
name: git.coopcloud.tech/decentral1se/iroh-go
steps:
  - name: go build
    image: golang:1.26
    commands:
      - go build -v ./...

  - name: examples
    image: golang:1.26
    commands:
      - for ex in $(find examples -mindepth 1 -maxdepth 1 -type d -not -path "*-desktop"); do make -C $ex; done
    depends_on:
      - go build

trigger:
  action:
    exclude:
      - synchronized
